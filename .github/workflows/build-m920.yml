name: build-m920
# Manual run: Actions tab -> build-m920 -> Run workflow. Builds the DWR-M920 sketch on the
# DIR-842 OpenWrt base (ggbruno fork, Linux 4.14). First builds are expected to need fixes.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    container: debian:11
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: Build tools
        run: |
          # Debian 11 is end-of-life: its packages now live on archive.debian.org
          echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian-security bullseye-security main" >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          # Debian 11 is end-of-life: use the archive servers
          rm -f /etc/apt/sources.list.d/*
          printf '%s\n' 'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' > /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update
          apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext \
            zlib1g-dev swig unzip time rsync python3 python2 wget file curl perl xsltproc \
            libxml-parser-perl ca-certificates ccache
      - name: Get this branch
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" src
      - name: Base tree + DIR-842 overlay + M920 overlay
        run: |
          git clone https://github.com/ggbruno/openwrt openwrt
          git -C openwrt checkout 8a0ccb93f3431bcf8f5c5d03d4acc2c8e442de67
          git clone --depth 1 https://github.com/MichaelPriest/openwrt-dlink-dir842-r1 dir842
          cp -a dir842/files/. openwrt/
          cp dir842/feeds.conf openwrt/feeds.conf
          cp src/openwrt-port/target/linux/realtek/dts/DWRM920.dts openwrt/target/linux/realtek/dts/
          cp src/openwrt-port/target/linux/realtek/patches-4.14/*.patch openwrt/target/linux/realtek/patches-4.14/
          python3 src/openwrt-port/scripts/splice_m920.py openwrt/target/linux/realtek/image/Makefile src/openwrt-port/image-profile.mk
      - name: Feeds and config
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf '%s\n' CONFIG_TARGET_realtek=y CONFIG_TARGET_realtek_rtl8197f=y \
            CONFIG_TARGET_realtek_rtl8197f_DEVICE_DWRM920=y '# CONFIG_KERNEL_CRASHLOG is not set' > .config
          make defconfig
          grep -E "DWRM920|TARGET_realtek|CRASHLOG" .config
      - name: Download sources
        working-directory: openwrt
        run: make download -j8
      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) V=s > ../build.log 2>&1 || (make -j1 V=s > ../build-retry.log 2>&1)
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          T=openwrt/bin/targets/realtek/rtl8197f
          cp $T/*.bin $T/*.manifest $T/sha256sums $T/profiles.json out/ 2>/dev/null || true
          cp openwrt/.config out/config.txt 2>/dev/null || true
          grep -E "DWRM920|TARGET_realtek|TARGET_DEVICE" openwrt/.config > out/config-grep.txt 2>&1 || true
          { echo "== image files"; ls -l $T 2>&1; echo "== all bins"; find openwrt/bin -name "*.bin" -exec ls -l {} + 2>&1; \
            echo "== dtb/dts"; find openwrt/build_dir -name "DWRM920*" 2>&1 | head; } > out/report.txt
          tail -n 300 build.log > out/build-tail.log 2>/dev/null || true
          tail -n 300 build-retry.log > out/build-retry-tail.log 2>/dev/null || true
      - name: Publish results to branch build-output
        if: always()
        run: |
          cd src
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q --orphan build-output
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../out/. .
          git add -A
          git commit -q -m "build output run ${{ github.run_id }}"
          git push -f origin build-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m920-build
          path: out
